*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Tajawal",system-ui,sans-serif;color:var(--paper);background:var(--ink);overflow-x:hidden}
.amb{position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(6,5,4,.9),rgba(6,5,4,.97)),var(--hero) center/cover}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.wrap{position:relative;max-width:480px;margin:0 auto;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-start;
 overflow:hidden;background:var(--ink);box-shadow:0 0 90px rgba(212,175,55,.14)}
.photo{position:absolute;inset:0;background:var(--hero) 50% 60%/cover;animation:kb 22s ease-in-out infinite alternate}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,5,4,.93),rgba(6,5,4,.7) 42%,rgba(6,5,4,.74) 72%,rgba(6,5,4,.96))}
.frame{position:absolute;inset:14px;border:1px solid rgba(212,175,55,.5);pointer-events:none;z-index:2}
.frame::before,.frame::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold-hi)}
.frame::before{top:-2px;inset-inline-start:-2px;border-width:2px 0 0 2px}
.frame::after{bottom:-2px;inset-inline-end:-2px;border-width:0 2px 2px 0}
[dir=rtl] .frame::before{border-width:2px 2px 0 0}[dir=rtl] .frame::after{border-width:0 0 2px 2px}
main{position:relative;z-index:3;flex:1;width:100%;display:flex;flex-direction:column;padding:max(clamp(30px,4.5svh,52px),calc(env(safe-area-inset-top,0px) + 26px)) 26px 8px}
.top{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:clamp(6px,1.4svh,14px)}
.logo{width:clamp(88px,15svh,140px);height:auto;filter:drop-shadow(0 0 18px rgba(212,175,55,.65))}
h1{margin-top:6px;font-family:"Cinzel",serif;font-weight:700;font-size:clamp(2.2rem,10.5vw,2.9rem);line-height:1.1;letter-spacing:.14em;padding-left:.14em;direction:ltr;text-align:center;
 background:linear-gradient(100deg,var(--gold-lo) 20%,var(--gold-hi) 40%,#fff6cf 50%,var(--gold-hi) 60%,var(--gold-lo) 80%) 0 0/250% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite}
.tag{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.tag strong{font-size:clamp(1.5rem,6.6vw,1.95rem);font-weight:700;line-height:1.3;color:var(--paper);text-shadow:0 2px 16px rgba(0,0,0,.7)}
.tag span{font-size:clamp(1rem,4.3vw,1.2rem);font-weight:500;letter-spacing:.03em;color:var(--gold-hi)}
.rule{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.stack{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;padding:clamp(16px,2.8svh,23px) 12px;border-radius:16px;
 font:700 1rem "Tajawal",sans-serif;color:var(--paper);text-decoration:none;cursor:pointer;background:rgba(14,11,5,.7);
 border:1px solid rgba(212,175,55,.55);transition:transform .15s,box-shadow .25s,border-color .2s}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,236,170,.35),transparent);transition:left .6s}
.btn:hover::after{left:130%}
.btn:hover{border-color:var(--gold-hi);box-shadow:0 0 22px rgba(212,175,55,.3)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.soc:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.btn svg{width:clamp(22px,3.2svh,26px);height:clamp(22px,3.2svh,26px);fill:currentColor}

.btn.main{grid-column:1/-1;padding:clamp(20px,3.4svh,28px);font-size:1.25rem;color:#171004;border-color:transparent;background:linear-gradient(135deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));box-shadow:0 10px 34px rgba(212,175,55,.35)}
.btn.main::after{animation:sweep 4s ease-in-out 1.5s infinite}
.socials{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;gap:12px;width:100%}
.soc{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--paper);text-decoration:none;min-width:72px}
.soc .ic{font-style:normal;display:grid;place-items:center;width:clamp(60px,10svh,80px);height:clamp(60px,10svh,80px);border-radius:50%;color:var(--gold-hi);border:1px solid rgba(212,175,55,.65);background:radial-gradient(circle at 35% 30%,#1d1608,#080604);box-shadow:0 8px 22px rgba(0,0,0,.55);transition:transform .15s,box-shadow .25s,background .25s,color .25s}
.soc svg{width:clamp(27px,4.4svh,36px);height:clamp(27px,4.4svh,36px);fill:currentColor}
.soc b{font-weight:700;font-size:.95rem;color:#d8c99a}
.soc:hover .ic{box-shadow:0 0 22px rgba(212,175,55,.45);color:#171004;background:linear-gradient(135deg,var(--gold-hi),var(--gold))}
.soc:hover b{color:var(--gold-hi)}
.soc:active .ic{transform:scale(.94)}
footer{direction:ltr;position:relative;z-index:3;text-align:center;padding:4px 0 calc(22px + env(safe-area-inset-bottom,0px));font-family:"Cinzel",serif;font-weight:500;font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;color:#a9996b}
footer bdi{font-weight:700;color:var(--gold-hi);text-shadow:0 0 14px rgba(212,175,55,.55)}
footer a{display:flex;flex-direction:column;align-items:center;gap:7px;color:inherit;text-decoration:none}
.row{display:flex;align-items:center;gap:9px}
.klk{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:0 0 10px rgba(40,140,255,.35)}
.kt{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
footer a:focus-visible{outline:3px solid var(--gold-hi);outline-offset:6px;border-radius:6px}
footer em{display:inline-flex;align-items:center;gap:7px;font-style:normal;font-family:"Tajawal",sans-serif;font-weight:700;font-size:.85rem;letter-spacing:0;text-transform:none;color:var(--gold-hi);padding-bottom:2px;border-bottom:1px solid rgba(212,175,55,.55);transition:border-color .25s,text-shadow .25s}
footer em svg{width:15px;height:15px;fill:currentColor}
footer a:hover em{border-color:var(--gold-hi);text-shadow:0 0 12px rgba(212,175,55,.6)}
@keyframes kb{to{transform:scale(1.1)}}
@keyframes shine{0%{background-position:100% 0}60%,100%{background-position:-100% 0}}
@keyframes sweep{0%{left:-60%}35%,100%{left:130%}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
 .logo,.tag,.rule,.stack,.socials{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
 h1{animation:up .9s .1s both,shine 6s ease-in-out 1.2s infinite}.tag{animation-delay:.2s}.rule{animation-delay:.3s}.stack{animation-delay:.4s}.socials{animation-delay:.55s}
}
@media (prefers-reduced-motion:reduce){.photo,h1,.btn.main::after{animation:none}}
</style>
</head>
