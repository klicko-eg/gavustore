main{max-width:440px;margin:0 auto;padding:40px 20px 32px;display:flex;flex-direction:column;align-items:center}
.logo{width:132px;height:auto;filter:drop-shadow(0 0 22px rgba(212,175,55,.45))}
h1{margin-top:18px;font-family:"Cinzel",serif;font-weight:700;font-size:2rem;letter-spacing:.18em;
 background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));
 -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin-top:6px;font-size:1rem;color:#cdbf94}
.rule{width:64px;height:2px;margin:22px 0 26px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.stack{width:100%;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;border-radius:14px;
 font:700 1.05rem "Tajawal",sans-serif;color:var(--paper);text-decoration:none;cursor:pointer;
 background:rgba(10,8,6,.62);border:1px solid rgba(212,175,55,.55);backdrop-filter:blur(6px);
 transition:transform .15s,background .2s,border-color .2s}
.btn svg{width:24px;height:24px;flex:none;fill:currentColor}
.btn span{flex:1}
.btn:hover{background:rgba(212,175,55,.14);border-color:var(--gold-hi)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.btn.main{color:#1a1305;border-color:transparent;background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo))}
.btn.main:hover{filter:brightness(1.07)}
.num{direction:ltr;unicode-bidi:isolate;font-weight:500;font-size:.95rem;opacity:.85}
h2{align-self:flex-start;margin:30px 0 12px;font-size:1.05rem;font-weight:700;color:var(--gold)}
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.socials .btn{flex-direction:column;gap:8px;padding:16px 8px;font-size:.92rem;text-align:center}
.socials .btn span{flex:none}
.socials .btn svg{width:28px;height:28px}
footer{margin-top:34px;font-size:.8rem;color:#8d8160}
@media (prefers-reduced-motion:no-preference){
 .logo{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
 @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
}
</style>
